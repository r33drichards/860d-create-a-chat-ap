<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .container-fluid {
      max-width: 1200px;
    }
    #conversation .user::before {
      content: 'You asked: ';
      font-weight: bold;
      display: block;
    }
    #conversation .model::before {
      content: 'AI Response: ';
      font-weight: bold;
      display: block;
    }
    #spinner {
      opacity: 0;
      transition: opacity 500ms ease-in;
      width: 30px;
      height: 30px;
      border: 3px solid #222;
      border-bottom-color: transparent;
      border-radius: 50%;
      animation: rotation 1s linear infinite;
    }
    @keyframes rotation {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    #spinner.active {
      opacity: 1;
    }
    .sidebar {
      background-color: #f8f9fa;
      border-right: 1px solid #dee2e6;
      height: 100vh;
      overflow-y: auto;
    }
    .session-item {
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .session-item:hover {
      background-color: #e9ecef;
    }
    .chat-container {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #conversation {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
    }
    .chat-input {
      border-top: 1px solid #dee2e6;
      padding: 1rem;
      background-color: white;
    }
  </style>
</head>
<body>
  <div class="container-fluid p-0">
    <div class="row g-0">
      <!-- Sidebar for sessions -->
      <div class="col-md-3 sidebar">
        <div class="p-3 border-bottom">
          <h5>Chat Sessions</h5>
          <button id="new-session-btn" class="btn btn-primary btn-sm w-100">
            New Conversation
          </button>
        </div>
        <div id="sessions-container" class="overflow-auto">
          <!-- Sessions will be loaded here -->
        </div>
      </div>

      <!-- Main chat area -->
      <div class="col-md-9">
        <div class="chat-container">
          <div class="p-3 border-bottom bg-light">
            <h4>Chat App</h4>
            <div id="current-session" class="text-muted small">
              No session selected
            </div>
          </div>

          <div id="conversation"></div>

          <div class="d-flex justify-content-center p-2">
            <div id="spinner"></div>
          </div>

          <div class="chat-input">
            <form method="post">
              <div class="input-group">
                <input id="prompt-input" name="prompt" class="form-control" placeholder="Ask me anything..."/>
                <button class="btn btn-primary">Send</button>
              </div>
            </form>
            <div id="error" class="d-none text-danger mt-2">
              Error occurred, check the browser developer console for more information.
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
<script src="https://cdnjs.cloudflare.com/ajax/libs/typescript/5.6.3/typescript.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script type="module">
  async function loadTs() {
    const response = await fetch('/chat_app.ts');
    const tsCode = await response.text();
    const jsCode = window.ts.transpile(tsCode, { target: "es2015" });
    let script = document.createElement('script');
    script.type = 'module';
    script.text = jsCode;
    document.body.appendChild(script);
  }

  loadTs().catch((e) => {
    console.error(e);
    document.getElementById('error').classList.remove('d-none');
    document.getElementById('spinner').classList.remove('active');
  });
</script>
