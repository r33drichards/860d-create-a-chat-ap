[project]
name = "app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Your Name", email = "you@example.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.117.1",
    "logfire[fastapi,sqlite3]>=4.10.0",
    "pydantic-ai-slim[mcp]>=1.0.10",
    "openai>=1.0.0",
    "typing-extensions>=4.15.0",
    "uvicorn[standard]>=0.37.0",
    "minizinc>=0.10.0",
    "mcp-solver",
    "mini-agent-action>=0.1.4",
]



[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
mcp-solver = { git = "https://github.com/r33drichards/mcp-solver", branch = "main"  }


[tool.uv.extra-build-dependencies]
mcp-solver = ["hatchling"]
